<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — DelegateIQ</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;min-width:0}
    .form-row-2 .form-group{min-width:0}
    .form-row-2 input{width:100%;min-width:0;box-sizing:border-box}
    .auth-card{overflow:hidden}
    .btn-loading{opacity:0.7;cursor:not-allowed;pointer-events:none}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body class="auth-page">
  <div class="auth-container">
    <a href="../index.html" class="auth-logo-centered">
      <div class="logo-mark">D</div>
      <span class="logo-text">DelegateIQ</span>
    </a>
    <div class="auth-card">
      <div class="auth-toggle-row">
        <a href="login.html" class="auth-toggle">Sign In</a>
        <a href="signup.html" class="auth-toggle active">Sign Up</a>
      </div>
      <h2 class="auth-title">Join DelegateIQ ✦</h2>
      <p class="auth-sub">Free forever — no credit card required</p>
      <div class="auth-error" id="authError"></div>
      <div id="authSuccess" style="background:#F0FDF4;border:1px solid #86EFAC;color:#166534;padding:10px 14px;border-radius:var(--r-md);font-size:13px;font-weight:600;display:none;">
        ✅ Account created! Redirecting...
      </div>
      <form class="auth-form" id="signupForm">
        <div class="form-row-2">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="fname" placeholder="Garvita" required autocomplete="given-name"/>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lname" placeholder="Manish Gupta" required autocomplete="family-name"/>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@college.edu" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label>School / College <span style="color:var(--text-muted);font-weight:400;font-size:11px;text-transform:none">(optional)</span></label>
          <input type="text" id="school" placeholder="e.g. Delhi Public School" autocomplete="organization"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-pw-wrap">
            <input type="password" id="password" placeholder="Min. 6 characters" required autocomplete="new-password"/>
            <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
          </div>
          <div id="pwStrength" class="pw-strength"></div>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="terms" required/>
          I agree to the <a href="../terms.html" target="_blank">Terms</a> and <a href="../privacy.html" target="_blank">Privacy Policy</a>
        </label>
        <button type="submit" class="btn-primary btn-full" id="signupBtn">Create Account →</button>
      </form>
      <div class="auth-divider"><span>or</span></div>
      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqNmnpQRg5uUYu4Pp_k0k90wNBmJxpuH0",
      authDomain: "delegate-iq-2025.firebaseapp.com",
      projectId: "delegate-iq-2025",
      storageBucket: "delegate-iq-2025.firebasestorage.app",
      messagingSenderId: "612696020579",
      appId: "1:612696020579:web:90255861a0d531f2580a56"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Already logged in → dashboard
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'dashboard.html';
    });

    let isSubmitting = false;

    function setLoading(loading) {
      isSubmitting = loading;
      const btn = document.getElementById('signupBtn');
      const gBtn = document.getElementById('googleBtn');
      if (loading) {
        btn.innerHTML = '<span class="spinner"></span>Creating account...';
        btn.classList.add('btn-loading');
        gBtn.disabled = true;
      } else {
        btn.innerHTML = 'Create Account →';
        btn.classList.remove('btn-loading');
        gBtn.disabled = false;
      }
    }

    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('authSuccess').style.display = 'none';
    }

    function showSuccess() {
      document.getElementById('authError').classList.remove('show');
      document.getElementById('authSuccess').style.display = 'block';
    }

    function saveProfile(uid, data) {
      localStorage.setItem('diq_profile', JSON.stringify({
        uid,
        ...data,
        badges: ['first_login'],
        conferences: [],
        researchCount: 0
      }));
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSubmitting) return; // prevent double submit

      const fname = document.getElementById('fname').value.trim();
      const lname = document.getElementById('lname').value.trim();
      const email = document.getElementById('email').value.trim();
      const school = document.getElementById('school').value.trim();
      const password = document.getElementById('password').value;

      if (!fname || !lname) { showError('Please enter your first and last name.'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

      setLoading(true);

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const displayName = fname + ' ' + lname;
        const initials = (fname[0] + lname[0]).toUpperCase();

        await cred.user.updateProfile({ displayName });

        saveProfile(cred.user.uid, {
          firstName: fname,
          lastName: lname,
          displayName,
          email,
          school: school || '',
          initials
        });

        showSuccess();
        setTimeout(() => window.location.href = 'dashboard.html', 1000);

      } catch (err) {
        setLoading(false);
        const msgs = {
          'auth/email-already-in-use': '⚠️ This email is already registered. Try signing in!',
          'auth/weak-password': '⚠️ Password must be at least 6 characters.',
          'auth/invalid-email': '⚠️ Please enter a valid email address.',
          'auth/network-request-failed': '⚠️ No internet connection. Check your WiFi.',
          'auth/too-many-requests': '⚠️ Too many attempts. Please wait a moment.',
          'auth/unauthorized-domain': '⚠️ Domain not authorized. Contact support.',
        };
        showError(msgs[err.code] || '⚠️ ' + err.message);
      }
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      if (isSubmitting) return;
      setLoading(true);
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        const user = cred.user;
        const parts = (user.displayName || 'Delegate User').split(' ');
        saveProfile(user.uid, {
          firstName: parts[0],
          lastName: parts.slice(1).join(' '),
          displayName: user.displayName || 'Delegate',
          email: user.email,
          school: '',
          initials: (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase()
        });
        showSuccess();
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (err) {
        setLoading(false);
        if (err.code !== 'auth/popup-closed-by-user') {
          showError('⚠️ Google sign-in failed. Try again.');
        }
      }
    });

    window.togglePw = function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      document.querySelector('.toggle-pw').textContent = input.type === 'password' ? '👁' : '🔒';
    };

    document.getElementById('password').addEventListener('input', function() {
      const v = this.value;
      const el = document.getElementById('pwStrength');
      if (!v) { el.innerHTML = ''; return; }
      const s = v.length >= 10 && /[A-Z]/.test(v) && /[0-9]/.test(v) ? 'strong' : v.length >= 6 ? 'medium' : 'weak';
      const labels = { weak: '🔴 Too short (min 6)', medium: '🟡 Medium', strong: '🟢 Strong' };
      el.innerHTML = '<span class="pw-label ' + s + '">' + labels[s] + '</span>';
    });
  </script>
</body>
</html>
